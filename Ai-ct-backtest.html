var FORMULA_STORE = {};
function parseMistikCode(code){ if(!code) return 'NORMAL'; code=code.toLowerCase(); if(code==='ml') return 'ML'; if(code==='mb') return 'MB'; if(code==='ty') return 'TY'; if(code==='ix') return 'IX'; if(code==='normal') return 'NORMAL'; if(/^m\d+$/.test(code)) return code.toUpperCase(); return 'NORMAL'; }
function tokenizeRumusan(expr){
  var tokens=[]; var i=0; expr=expr.replace(/\s+/g,'').toLowerCase();
  while(i<expr.length){
    var ch=expr[i];
    if(ch==='('){ tokens.push({type:'LPAREN'}); i++; }
    else if(ch===')'){
      tokens.push({type:'RPAREN'}); i++;
      var sub=expr.slice(i); var m=sub.match(/^(ml|mb|ty|ix|m\d+|normal)/);
      if(m){ tokens.push({type:'MISTIK',mode:parseMistikCode(m[1])}); i+=m[1].length; }
    }
    else if(ch==='+'||ch==='-'){ tokens.push({type:'OP',op:ch}); i++; }
    else if(/[acke]/.test(ch)){
      var posLetter=ch; i++;
      var numStr=''; while(i<expr.length && /\d/.test(expr[i])){ numStr+=expr[i]; i++; }
      if(!numStr) continue;
      var roundNum=parseInt(numStr);
      if(roundNum<1||roundNum>10) continue;
      var sub=expr.slice(i); var m=sub.match(/^(ml|mb|ty|ix|m\d+|normal)/);
      var mode='NORMAL'; if(m){ mode=parseMistikCode(m[1]); i+=m[1].length; }
      var posMap={a:'as',c:'cop',k:'kepala',e:'ekor'};
      tokens.push({type:'POS',pos:posMap[posLetter],r:roundNum,mode:mode});
    } else { i++; }
  }
  return tokens;
}
function parseRumusanFormula(str){
  var result={tokens:[],ast:null,pangkal:'NORMAL',error:null,posList:[]};
  if(!str||!str.trim()){ result.error='Rumusan kosong'; return result; }
  str=str.trim();
  var parts=str.split('=');
  var left=parts[0]||''; var right=parts[parts.length-1]||'';
  // pangkal = last part if it's mistik or contains =
  if(parts.length>1){
    var last=parts[parts.length-1].trim();
    if(/^(ml|mb|ty|ix|m\d+|normal)$/i.test(last)){ result.pangkal=parseMistikCode(last); left=parts.slice(0,-1).join('='); }
    else {
      // check if last contains mistik only after pos? Actually =ty case
      var mm=last.match(/^(ml|mb|ty|ix|m\d+|normal)$/i);
      if(mm){ result.pangkal=parseMistikCode(mm[1]); left=parts.slice(0,-1).join('='); }
      else {
        // if last is like A1ml then pangkal is from its mistik? We treat last = as pangkal only if no pos
        // If right part has pos, keep it as part of left? For (A9+C5)-K1=ty, left=(A9+C5)-K1, right=ty -> correct
        // For A10+(C1+K1)ml=mb -> left=A10+(C1+K1)ml, right=mb -> pangkal mb, left includes ml as group mistik already tokenized
        // So if right is mistik code, we already handled
        // If right contains pos, then no pangkal? Let's parse pangkal from trailing =ty
        // Actually parts splitting by = will give [A10+(C1+K1)ml, mb] -> last mb is pangkal
        // If formula has no =ty, pangkal stays NORMAL
        // So check if last part is mistik code, we set pangkal
        // Already done above
        // If last part is not mistik code but contains mistik code? e.g. =ty we captured
        // For safety, if last part matches mistik, set pangkal
        if(/^(ml|mb|ty|ix)$/i.test(last)){ result.pangkal=parseMistikCode(last); left=parts.slice(0,-1).join('='); }
      }
    }
  }
  // if pangkal still NORMAL and last part after = contains mistik at end, try extract
  if(result.pangkal==='NORMAL' && parts.length>1){
    var maybeRight=parts[parts.length-1];
    var mm2=maybeRight.match(/(ml|mb|ty|ix)$/i);
    if(mm2 && !/[acke]\d/.test(maybeRight)){ result.pangkal=parseMistikCode(mm2[1]); left=parts.slice(0,-1).join('='); }
  }
  var tokens=tokenizeRumusan(left);
  if(tokens.length===0){ result.error='Tidak ada token valid. Contoh: (A9+C5)-K1=ty atau A10+(C1+K1)ml'; return result; }
  // Parse tokens to AST
  var idx=0;
  function peek(){ return tokens[idx]; }
  function consume(){ return tokens[idx++]; }
  function parseExpr(){
    var node=parseFactor();
    if(!node) return null;
    while(peek() && peek().type==='OP'){
      var op=consume();
      var right=parseFactor();
      if(!right) break;
      node={type:'BINOP',op:op.op,left:node,right:right};
    }
    return node;
  }
  function parseFactor(){
    var t=peek();
    if(!t) return null;
    if(t.type==='POS'){ consume(); return {type:'POS',pos:t.pos,r:t.r,mode:t.mode}; }
    if(t.type==='LPAREN'){
      consume();
      var inner=parseExpr();
      var rp=peek();
      if(rp && rp.type==='RPAREN') consume();
      var nxt=peek();
      if(nxt && nxt.type==='MISTIK'){ consume(); return {type:'MISTIK',mode:nxt.mode,child:inner}; }
      return inner;
    }
    return null;
  }
  var ast=parseExpr();
  if(!ast){ result.error='Gagal parsing kurung. Periksa format (A9+C5)-K1'; return result; }
  // collect POS
  var posList=[];
  function collect(n){ if(!n) return; if(n.type==='POS') posList.push(n); else if(n.type==='BINOP'){ collect(n.left); collect(n.right); } else if(n.type==='MISTIK'){ collect(n.child); } }
  collect(ast);
  result.tokens=tokens; result.ast=ast; result.posList=posList;
  return result;
}
function applyRumusan(pola){
  var inputEl=document.getElementById(pola+'_rumusan_input'); var statusEl=document.getElementById(pola+'_rumusan_status');
  var parsed=parseRumusanFormula(inputEl.value);

  for(var t=0;t<parsed.posList.length;t++){ var tok=parsed.posList[t]; var sw=document.getElementById(pola+'_sw_r'+tok.r+'_'+tok.pos); var cell=document.getElementById(pola+'_cell_r'+tok.r+'_'+tok.pos); var inp=document.getElementById(pola+'_in_r'+tok.r+'_'+tok.pos); var modeSel=document.getElementById(pola+'_mode_r'+tok.r+'_'+tok.pos); if(sw){ sw.innerText='ON'; sw.classList.add('on'); } if(cell){ cell.classList.remove('cell-off'); } if(inp){ inp.disabled=false; } if(modeSel){ modeSel.value=tok.mode; } }
  var pangkalSel=document.getElementById(pola+'_mode_pangkal'); if(pangkalSel && parsed.pangkal){ pangkalSel.value=parsed.pangkal; }
  FORMULA_STORE[pola]=parsed;

  runMegaFormula(pola);
}

function singleDigit(v){ v=Math.abs(v); if(v===10) return 1; if(v===11) return 2; while(v>=10){ var s=v.toString(); v=parseInt(s[0])+parseInt(s[1]); } return v; }

function saveMegaPreset(pola,slot,e){ e.stopPropagation(); var pre=pola+'_'; var megaData={ops:[document.getElementById(pre+'op_1').value,document.getElementById(pre+'op_2').value,document.getElementById(pre+'op_3').value],pangkal:document.getElementById(pre+'mode_pangkal').value,step:document.getElementById(pre+'mode_step').value,rumusan:document.getElementById(pola+'_rumusan_input').value,rounds:{}}; for(var r=1;r<=10;r++){ megaData.rounds[r]={}; var posList=['as','cop','kepala','ekor']; for(var i=0;i<posList.length;i++){ var pos=posList[i]; megaData.rounds[r][pos]={sw:document.getElementById(pola+'_sw_r'+r+'_'+pos).innerText,val:document.getElementById(pola+'_in_r'+r+'_'+pos).value,mode:document.getElementById(pola+'_mode_r'+r+'_'+pos).value}; } } localStorage.setItem('aict_master_slot_'+pola+'_'+slot,JSON.stringify(megaData)); alert('✅ Pola '+pola+' disimpan di PAKET '+slot); highlightActive(pola,slot); }
function loadMegaPreset(pola,slot){ var raw=localStorage.getItem('aict_master_slot_'+pola+'_'+slot); if(!raw){ alert('Slot kosong'); return; } var d=JSON.parse(raw); var pre=pola+'_'; if(d.ops){ document.getElementById(pre+'op_1').value=d.ops[0]; document.getElementById(pre+'op_2').value=d.ops[1]; document.getElementById(pre+'op_3').value=d.ops[2]; } if(d.pangkal) document.getElementById(pre+'mode_pangkal').value=d.pangkal; if(d.step) document.getElementById(pre+'mode_step').value=d.step; if(d.rumusan){ document.getElementById(pola+'_rumusan_input').value=d.rumusan; var parsed=parseRumusanFormula(d.rumusan); if(!parsed.error) FORMULA_STORE[pola]=parsed; } for(var r=1;r<=10;r++){ var posList=['as','cop','kepala','ekor']; for(var i=0;i<posList.length;i++){ var pos=posList[i]; var rData=d.rounds[r][pos]; document.getElementById(pola+'_in_r'+r+'_'+pos).value=rData.val; document.getElementById(pola+'_mode_r'+r+'_'+pos).value=rData.mode; var sw=document.getElementById(pola+'_sw_r'+r+'_'+pos); var cell=document.getElementById(pola+'_cell_r'+r+'_'+pos); var input=document.getElementById(pola+'_in_r'+r+'_'+pos); if(rData.sw==='OFF'){ sw.innerText='OFF'; sw.classList.remove('on'); cell.classList.add('cell-off'); input.disabled=true; } else { sw.innerText='ON'; sw.classList.add('on'); cell.classList.remove('cell-off'); input.disabled=false; } } } highlightActive(pola,slot); runMegaFormula(pola); }

function generateTierWithStep(pola,p,stepMode,tierKey){ if(stepMode==='NORMAL'){ var offs=POLA_TIERS[pola][tierKey]; var arr=[]; for(var o=0;o<offs.length;o++) arr.push((p+offs[o])%10); return arr; } var baseGen=STEP_MODES[stepMode]&&STEP_MODES[stepMode].gen; var full7=[]; if(baseGen){ full7=baseGen(p); } else { full7=POLA_TIERS[pola]['ct7'].map(function(o){ return (p+o)%10; }); } if(tierKey==='ct7') return full7; if(tierKey==='ct6') return full7.slice(0,6); if(tierKey==='ai5') return full7.slice(0,5); if(tierKey==='ai4') return full7.slice(0,4); if(tierKey==='ai3') return full7.slice(0,3); if(tierKey==='bom2d') return full7.slice(0,2); return full7; }
function runMegaFormula(pola){
  var pre=pola+'_'; var modePangkal=document.getElementById(pre+'mode_pangkal').value; var modeStep=document.getElementById(pre+'mode_step').value;
  var formula=FORMULA_STORE[pola]; var total_akumulasi=0; var adaData=false; var textParts=[];
  function getBoxRaw(pos,r){ var el=document.getElementById(pola+'_in_r'+r+'_'+pos); return el?el.value:'0'; }
  function getMistikMode(pos,r){ var el=document.getElementById(pola+'_mode_r'+r+'_'+pos); return el?el.value:'NORMAL'; }
  function evalNode(node){
    if(!node) return 0;
    if(node.type==='POS'){ var raw=getBoxRaw(node.pos,node.r); var mode=getMistikMode(node.pos,node.r); var processed=getMistik(raw,mode); return processed; }
    if(node.type==='BINOP'){ var lv=evalNode(node.left); var rv=evalNode(node.right); if(node.op==='+') return lv+rv; else return Math.abs(lv-rv); }
    if(node.type==='MISTIK'){ var cv=evalNode(node.child); var base=singleDigit(cv); return getMistik(base,node.mode); }
    return 0;
  }
  function collectDisplay(node){
    if(!node) return '';
    if(node.type==='POS'){
      var raw=getBoxRaw(node.pos,node.r); var mode=getMistikMode(node.pos,node.r); var proc=getMistik(raw,mode);
      var labelMap={as:'A',cop:'C',kepala:'K',ekor:'E'}; return labelMap[node.pos]+node.r+'('+proc+(mode!=='NORMAL'?'['+mode+']':'')+')';
    }
    if(node.type==='BINOP'){ return '('+collectDisplay(node.left)+' '+node.op+' '+collectDisplay(node.right)+')'; }
    if(node.type==='MISTIK'){ return '('+collectDisplay(node.child)+')['+node.mode+']'; }
    return '';
  }
  if(formula && formula.ast){
    total_akumulasi=evalNode(formula.ast); adaData=true;
    var displayStr=collectDisplay(formula.ast);
    var indContainer=document.getElementById(pre+'rumus_live_indicator');
    indContainer.innerHTML='<span class="ind-badge-part" style="background:#fef2f2;border-color:#fca5a5;color:#991b1b;">KURUNG: '+displayStr+'</span> <span class="ind-op">=</span> <span class="ind-badge-part" style="background:var(--primary);color:#fff;">'+total_akumulasi+' → '+singleDigit(total_akumulasi)+'</span>';
  } else {
    var op1=document.getElementById(pre+'op_1').value; var op2=document.getElementById(pre+'op_2').value; var op3=document.getElementById(pre+'op_3').value;
    for(var r=10;r>=1;r--){
      var statuses={ 'as':{on:document.getElementById(pola+'_sw_r'+r+'_as').innerText==='ON',code:'A',op:op1,style:'as-style'}, 'cop':{on:document.getElementById(pola+'_sw_r'+r+'_cop').innerText==='ON',code:'C',op:op1,style:'cop-style'}, 'kepala':{on:document.getElementById(pola+'_sw_r'+r+'_kepala').innerText==='ON',code:'K',op:op2,style:'kep-style'}, 'ekor':{on:document.getElementById(pola+'_sw_r'+r+'_ekor').innerText==='ON',code:'E',op:op3,style:'ekor-style'} };
      var posList=['as','cop','kepala','ekor'];
      for(var i=0;i<posList.length;i++){ var pos=posList[i]; var cur=statuses[pos]; if(cur.on){ var rawVal=document.getElementById(pola+'_in_r'+r+'_'+pos).value; var modeMistik=document.getElementById(pola+'_mode_r'+r+'_'+pos).value; var processedVal=getMistik(rawVal,modeMistik); var mstLabel=modeMistik!=='NORMAL'?' ('+modeMistik+')':''; textParts.push({html:'<span class="ind-badge-part '+cur.style+'">'+cur.code+r+' ('+processedVal+mstLabel+')</span>',op:cur.op,val:processedVal}); if(!adaData){ total_akumulasi=processedVal; adaData=true; } else { total_akumulasi=(cur.op==='+')?(total_akumulasi+processedVal):Math.abs(total_akumulasi-processedVal); } } }
    }
    var baseNormal=singleDigit(total_akumulasi); var p=getMistik(baseNormal,modePangkal);
    var indContainer=document.getElementById(pre+'rumus_live_indicator');
    if(textParts.length===0){ indContainer.innerHTML='<span style="color:var(--text-muted)">Semua OFF</span>'; } else { var combined=''; for(var k=0;k<textParts.length;k++){ if(k>0) combined+=' <span class="ind-op">'+textParts[k].op+'</span> '; combined+=textParts[k].html; } var pangkalLabel=modePangkal!=='NORMAL'?' ➔ <span class="ind-badge-part" style="color:var(--secondary);border-color:var(--secondary)">'+modePangkal+'</span>':''; var stepLabel=modeStep!=='NORMAL'?' ➔ <span class="ind-badge-part" style="color:#92400e;border-color:#d97706;background:#fef3c7">STEP:'+modeStep+'</span>':''; combined+=' <span class="ind-op">=</span> <span class="ind-badge-part" style="background:var(--primary);color:#fff;">'+total_akumulasi+' ('+baseNormal+')'+pangkalLabel+' ➔ P='+p+'</span>'+stepLabel; indContainer.innerHTML=combined; }
    var baseNormal2=singleDigit(total_akumulasi); var p2=getMistik(baseNormal2,modePangkal);
    var tiers={}; for(var t=0;t<TIER_KEYS.length;t++){ var key=TIER_KEYS[t]; tiers[key]=generateTierWithStep(pola,p2,modeStep,key); } for(var t2=0;t2<TIER_KEYS.length;t2++){ renderBoxes(pre+'tier_'+TIER_KEYS[t2],tiers[TIER_KEYS[t2]]); } window['_latest_'+pola]=tiers; return tiers;
  }
  var baseNormal=singleDigit(total_akumulasi); var p=getMistik(baseNormal,modePangkal);
  var tiers={}; for(var t=0;t<TIER_KEYS.length;t++){ var key=TIER_KEYS[t]; tiers[key]=generateTierWithStep(pola,p,modeStep,key); } for(var t2=0;t2<TIER_KEYS.length;t2++){ renderBoxes(pre+'tier_'+TIER_KEYS[t2],tiers[TIER_KEYS[t2]]); }
  // update indicator pangkal
  var indCont=document.getElementById(pre+'rumus_live_indicator'); if(indCont && formula && formula.ast){ indCont.innerHTML+= ' <span class="ind-badge-part" style="color:var(--secondary);border-color:var(--secondary)">Pangkal '+modePangkal+' → P='+p+'</span> <span class="ind-badge-part" style="color:#92400e;background:#fef3c7;border-color:#d97706">STEP:'+modeStep+'</span>'; }
  window['_latest_'+pola]=tiers; return tiers;
}
function renderBoxes(id,arr){ var el=document.getElementById(id); if(!el) return; var html=''; for(var i=0;i<arr.length;i++) html+='<div class="box-num">'+arr[i]+'</div>'; el.innerHTML=html; }
function runAllPolas(){ var results={}; for(var i=0;i<POLAS.length;i++){ results[POLAS[i]]=runMegaFormula(POLAS[i]); } for(var j=0;j<POLAS.length;j++){ var p=POLAS[j]; var t=results[p]; var el7=document.getElementById('cmp_'+p+'_7'); var el2=document.getElementById('cmp_'+p+'_2'); if(el7){ var html7=''; for(var x=0;x<t.ct7.length;x++) html7+='<div class="cmp-box">'+t.ct7[x]+'</div>'; el7.innerHTML=html7; } if(el2){ var html2=''; for(var y=0;y<t.bom2d.length;y++) html2+='<div class="cmp-box top2">'+t.bom2d[y]+'</div>'; el2.innerHTML=html2; } } var counter={}; for(var m=0;m<POLAS.length;m++){ var arr=results[POLAS[m]].bom2d; for(var n=0;n<arr.length;n++){ counter[arr[n]]=(counter[arr[n]]||0)+1; } } var irisan=Object.keys(counter).filter(function(k){return counter[k]>=2;}).sort(function(a,b){return counter[b]-counter[a]||a-b;}); var irisBody=document.getElementById('iris_body'); if(irisan.length===0){ irisBody.innerHTML='<span style="color:#64748b;font-size:11px;">Tidak ada irisan</span>'; } else { var hi=''; for(var q=0;q<irisan.length;q++) hi+='<div class="iris-box">'+irisan[q]+'</div>'; irisBody.innerHTML=hi; } }

function btRemove(i){ btData.rows.splice(i,1); btSave(); btRender(); }

function tarikPolaKeBacktest(pola){ var tiers=runMegaFormula(pola); var hasil=(tiers[btCurrentMode]||tiers['ct7']||[]).join(''); btData.rows.push({result:'',A:pola==='A'?hasil:'',B:pola==='B'?hasil:'',C:pola==='C'?hasil:'',D:pola==='D'?hasil:''}); if(pola==='A') btData.rows[btData.rows.length-1].A=hasil; btSave(); switchTab('BACKTEST'); btRender(); alert('Tarik Pola '+pola+' '+hasil); }
function tarikSemua(){ var tier=btCurrentMode||'ct7'; var hasil={}; for(var i=0;i<POLAS.length;i++){ var tiers=runMegaFormula(POLAS[i]); hasil[POLAS[i]]=(tiers[tier]||[]).join(''); } btData.rows.push({result:'',A:hasil.A,B:hasil.B,C:hasil.C,D:hasil.D}); btSave(); btRender(); }
btLoad(); btRender();
</script>

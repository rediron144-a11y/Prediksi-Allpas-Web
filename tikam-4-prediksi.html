<script>

var PATTERN_CT={A:{label:'CT A (0,2,3,4,6,7,9)',tiers:{ct7:[0,2,3,4,6,7,9],ct6:[0,2,3,4,6,7],ai5:[0,2,3,4,7],ai4:[0,3,4,7],ai3:[0,3,4],bom2d:[0,3]}},B:{label:'CT B (0,1,2,4,5,6,9)',tiers:{ct7:[0,1,2,4,5,6,9],ct6:[0,1,2,4,5,6],ai5:[0,1,2,4,5],ai4:[0,1,2,4],ai3:[0,1,2],bom2d:[0,2]}},C:{label:'CT C (0,2,3,4,5,6,7)',tiers:{ct7:[0,2,3,4,5,6,7],ct6:[0,2,3,4,5,6],ai5:[0,2,3,4,5],ai4:[0,2,3,4],ai3:[0,2,3],bom2d:[0,2]}},D:{label:'CT D (0,1,3,4,5,6,8)',tiers:{ct7:[0,1,3,4,5,6,8],ct6:[0,1,3,4,5,6],ai5:[0,1,3,4,5],ai4:[0,1,3,4],ai3:[0,1,3],bom2d:[0,1]}},E:{label:'CT E (0,1,3,4,6,8,9)',tiers:{ct7:[0,1,3,4,6,8,9],ct6:[0,1,3,4,6,8],ai5:[0,1,3,4,6],ai4:[0,1,3,4],ai3:[0,1,3],bom2d:[0,1]}},F:{label:'CT F (0,1,2,3,4,6,7)',tiers:{ct7:[0,1,2,3,4,6,7],ct6:[0,1,2,3,4,6],ai5:[0,1,2,3,4],ai4:[0,1,2,3],ai3:[0,1,2],bom2d:[0,1]}}};
var ROLE_MAP={A:{label:'BBFS',color:'#d97706',desc:'BBFS 9D-4D',defaultPattern:'A'},B:{label:'KEPALA',color:'#2563eb',desc:'KEPALA',defaultPattern:'A'},C:{label:'EKOR',color:'#ea580c',desc:'EKOR',defaultPattern:'C'},D:{label:'SELISIH',color:'#7c3aed',desc:'|K-E|',defaultPattern:'D'}};

var FORMULA_STORE={};

function tokenizeRumusan(expr){var tokens=[];var i=0;expr=expr.replace(/\s+/g,'').toLowerCase();while(i<expr.length){var ch=expr[i];if(ch==='('){tokens.push({type:'LPAREN'});i++;}else if(ch===')'){tokens.push({type:'RPAREN'});i++;var sub=expr.slice(i);var m=sub.match(/^(ml|mb|ty|ix)/);if(m){tokens.push({type:'MISTIK',mode:parseMistikCode(m[1])});i+=m[1].length;}}else if(ch==='+'||ch==='-'){tokens.push({type:'OP',op:ch});i++;}else if(/[acke]/.test(ch)){var posLetter=ch;i++;var numStr='';while(i<expr.length && /\d/.test(expr[i])){numStr+=expr[i];i++;}if(!numStr) continue;var roundNum=parseInt(numStr);var sub=expr.slice(i);var m=sub.match(/^(ml|mb|ty|ix)/);var mode='NORMAL';if(m){mode=parseMistikCode(m[1]);i+=m[1].length;}var posMap={a:'as',c:'cop',k:'kepala',e:'ekor'};tokens.push({type:'POS',pos:posMap[posLetter],r:roundNum,mode:mode});}else{i++;}}return tokens;}

if(role==='A'){var patternKey=document.getElementById('A_pattern_select')?document.getElementById('A_pattern_select').value:'A';var intervals=PATTERN_BBFS[patternKey]?PATTERN_BBFS[patternKey].intervals:[0,1,2,4,5,7,8,3,6];var set=new Set();intervals.forEach(function(s){set.add((p+s)%10);});var full=Array.from(set);return full.slice(0,tierNum);}
else{var patternKey=document.getElementById(role+'_pattern_select')?document.getElementById(role+'_pattern_select').value:ROLE_MAP[role].defaultPattern;var tiersDef=PATTERN_CT[patternKey]?PATTERN_CT[patternKey].tiers:ROLE_MAP[role].defaultPattern?PATTERN_CT[ROLE_MAP[role].defaultPattern].tiers:PATTERN_CT['A'].tiers;var map={7:'ct7',6:'ct6',5:'ai5',4:'ai4',3:'ai3',2:'bom2d'};var tierKey=map[tierNum]||'bom2d';var offs=tiersDef[tierKey]||[];var arr=[];for(var i=0;i<offs.length;i++) arr.push((p+offs[i])%10);return arr;}
}
async function startOptimizer(){
var role=document.getElementById('opt_role').value;var tierNum=parseInt(document.getElementById('opt_tier').value)||2;var mode=document.getElementById('opt_mode').value;
if(btRows.length<11){alert('Isi minimal 11 result di BACKTEST dulu bosq! Sekarang baru '+btRows.length);return;}
var btn=document.getElementById('btnScan');btn.disabled=true;var status=document.getElementById('opt_status');var progress=document.getElementById('opt_progress');var bar=document.getElementById('opt_progress_bar');var resultDiv=document.getElementById('opt_result');
progress.style.display='block';resultDiv.innerHTML='';status.innerText='Scanning...';
var tokens=[];for(var r=1;r<=5;r++){['A','C','K','E'].forEach(function(ch){tokens.push(ch+''+r);});}
var pangkalList=['TY','ML','MB','IX'];var ops=['+','-'];var candidates=[];
if(mode==='kurung2'){
for(var i=0;i<tokens.length;i++){for(var j=0;j<tokens.length;j++){if(i===j) continue;for(var o=0;o<ops.length;o++){for(var p=0;p<pangkalList.length;p++){candidates.push(tokens[i]+ops[o]+tokens[j]+'='+pangkalList[p]);}}}}
}else{
for(var i=0;i<tokens.length;i++){for(var j=0;j<tokens.length;j++){if(i===j) continue;for(var k=0;k<tokens.length;k++){if(k===i||k===j) continue;for(var o1=0;o1<ops.length;o1++){for(var o2=0;o2<ops.length;o2++){for(var pp=0;pp<pangkalList.length;pp++){candidates.push('('+tokens[i]+ops[o1]+tokens[j]+')'+ops[o2]+tokens[k]+'='+pangkalList[pp]);candidates.push(tokens[i]+ops[o1]+'('+tokens[j]+ops[o2]+tokens[k]+')='+pangkalList[pp]);}}}}
if(candidates.length>25000) break;}if(candidates.length>25000) break;}
}
status.innerText='Total kandidat: '+candidates.length+' - mulai hitung...';
var results=[];var batchSize=300;var total=candidates.length;
for(var idx=0;idx<total;idx+=batchSize){
var batch=candidates.slice(idx, idx+batchSize);
for(var b=0;b<batch.length;b++){
var formula=batch[b];
var jp=0;var totalTest=0;
for(var h=10;h<btRows.length;h++){
var rounds={};for(var rr=1;rr<=10;rr++){var resStr=btRows[h-rr].result;if(!resStr||resStr.length<4) continue;rounds[rr]=[parseInt(resStr[0]),parseInt(resStr[1]),parseInt(resStr[2]),parseInt(resStr[3])];}
var pVal=evalFormulaWithRounds(formula, rounds);if(pVal===null) continue;
var tier=generateTierForRole(pVal, role, tierNum);
var target=btRows[h].result;if(!target||target.length<4) continue;
var kep=parseInt(target[2]);var ekor=parseInt(target[3]);var selisih=Math.abs(kep-ekor);
var hit=false;
if(role==='A'){if(tier.includes(kep)&&tier.includes(ekor)) hit=true;}
else if(role==='B'){if(tier.includes(kep)) hit=true;}
else if(role==='C'){if(tier.includes(ekor)) hit=true;}
else if(role==='D'){if(tier.includes(selisih)) hit=true;}
if(hit) jp++;totalTest++;
}
if(totalTest>0){var rate=jp/totalTest;if(rate>=0.5){results.push({formula:formula,jp:jp,total:totalTest,rate:rate});}}
}
bar.style.width=((idx+batchSize)/total*100).toFixed(1)+'%';
status.innerText='Scan '+Math.min(idx+batchSize,total)+'/'+total+' - ditemukan '+results.length+' gacor >=50%';
await new Promise(r=>setTimeout(r,0));
}
results.sort(function(a,b){return b.rate-a.rate;});
var top=results.slice(0,15);
var html='';if(top.length===0){html='<div style="padding:12px;background:#fff;border-radius:8px;text-align:center;color:#991b1b;">Tidak ada rumusan >=50%. Coba ganti role/tier atau tambah history</div>';}else{for(var i=0;i<top.length;i++){var it=top[i];var pct=(it.rate*100).toFixed(1);var cls=i===0?'opt-card opt-card-top':'opt-card';html+='<div class="'+cls+'"><div><div class="opt-formula">'+it.formula+'</div><div style="font-size:9px;color:#64748b;margin-top:2px;">Test '+it.total+' | JP '+it.jp+'x | Pattern '+document.getElementById(it.formula.includes('A')?role+'_pattern_select':role+'_pattern_select').value+'</div></div><div style="display:flex;align-items:center;gap:6px;"><div class="opt-stats">'+pct+'% JP</div><button class="btn-opt-use" onclick="useOptFormula(\''+it.formula+'\',\''+role+'\')">PAKAI</button></div></div>';}}
resultDiv.innerHTML=html;
progress.style.display='none';status.innerText='Selesai! '+results.length+' gacor, top '+top.length;
btn.disabled=false;
}
function useOptFormula(formula, role){var pola=role;switchTab(pola);setTimeout(function(){var inputEl=document.getElementById(pola+'_rumusan_input');if(inputEl){inputEl.value=formula;applyRumusan(pola);alert('✅ Rumusan '+formula+' dipakai ke POLA '+pola+'='+ROLE_MAP[pola].label+' dengan Pattern '+document.getElementById(pola+'_pattern_select').value);}},300);}
btLoad();btRender();
window.addEventListener('DOMContentLoaded',function(){POLAS.forEach(function(pola){var sel=document.getElementById(pola+'_pattern_select');if(sel){sel.value=ROLE_MAP[pola].defaultPattern;}setCellValue(pola,1,'kepala','4');setCellValue(pola,1,'ekor','2');runMegaFormula(pola);});});
</script>
